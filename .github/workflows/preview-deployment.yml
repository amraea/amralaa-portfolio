name: Preview deployment verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-preview:
    if: github.ref == 'refs/heads/rebuild/astro'
    runs-on: ubuntu-latest
    environment:
      name: preview
      url: https://preview.amralaa.site
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js and pnpm
        uses: pnpm/setup@v3
        with:
          runtime: node@24
          install: false
          cache: true

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static site
        run: pnpm build

      - name: Verify generated files
        shell: bash
        run: |
          set -euo pipefail
          test -d dist
          required_files=(
            dist/index.html
            dist/404.html
            dist/sitemap-index.xml
            dist/robots.txt
            dist/favicon.svg
            dist/assets/cv.pdf
            dist/images/Gemini_Generated_Image_fawrrsfawrrsfawr.png
            dist/projects/ai-maintenance-planner/index.html
            dist/projects/master-data-automation-initiative/index.html
            dist/projects/sap-support-analytics-power-bi/index.html
          )
          for file in "${required_files[@]}"; do
            test -f "$file"
          done
          file_count=$(find dist -type f | wc -l | tr -d ' ')
          printf 'Build succeeded; generated files: %s\n' "$file_count"

      - name: Verify preview FTPS access and list account root
        shell: bash
        env:
          PREVIEW_FTP_HOST: ${{ secrets.PREVIEW_FTP_HOST }}
          PREVIEW_FTP_PORT: ${{ secrets.PREVIEW_FTP_PORT }}
          PREVIEW_FTP_USER: ${{ secrets.PREVIEW_FTP_USER }}
          PREVIEW_FTP_PASSWORD: ${{ secrets.PREVIEW_FTP_PASSWORD }}
        run: |
          set -euo pipefail

          [[ "$PREVIEW_FTP_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$PREVIEW_FTP_PORT" =~ ^[0-9]+$ ]]
          (( PREVIEW_FTP_PORT > 0 && PREVIEW_FTP_PORT <= 65535 ))
          [[ -n "$PREVIEW_FTP_USER" && -n "$PREVIEW_FTP_PASSWORD" ]]

          ftp_url="ftp://$PREVIEW_FTP_HOST:$PREVIEW_FTP_PORT/"
          # --ssl-reqd requires explicit FTPS; curl's normal TLS certificate verification remains enabled.
          listing_count=$(curl \
            --fail \
            --silent \
            --show-error \
            --connect-timeout 15 \
            --max-time 60 \
            --ssl-reqd \
            --ftp-pasv \
            --list-only \
            --user "$PREVIEW_FTP_USER:$PREVIEW_FTP_PASSWORD" \
            "$ftp_url" | wc -l | tr -d '[:space:]')
          printf 'Explicit FTPS connection succeeded; account-root entries listed: %s\n' "$listing_count"

      - name: Deploy preview files over explicit FTPS
        shell: bash
        env:
          PREVIEW_FTP_HOST: ${{ secrets.PREVIEW_FTP_HOST }}
          PREVIEW_FTP_PORT: ${{ secrets.PREVIEW_FTP_PORT }}
          PREVIEW_FTP_USER: ${{ secrets.PREVIEW_FTP_USER }}
          PREVIEW_FTP_PASSWORD: ${{ secrets.PREVIEW_FTP_PASSWORD }}
        run: |
          set -euo pipefail

          [[ "$PREVIEW_FTP_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$PREVIEW_FTP_PORT" =~ ^[0-9]+$ ]]
          (( PREVIEW_FTP_PORT > 0 && PREVIEW_FTP_PORT <= 65535 ))
          [[ -n "$PREVIEW_FTP_USER" && -n "$PREVIEW_FTP_PASSWORD" ]]

          ftp_root="ftp://$PREVIEW_FTP_HOST:$PREVIEW_FTP_PORT"
          uploaded_count=0
          while IFS= read -r -d '' file; do
            relative_path="${file#dist/}"
            # STOR replaces matching files; --ftp-create-dirs creates only needed paths inside the jailed account root.
            # No delete, rename, synchronization, or permission-changing operation is performed.
            curl \
              --fail \
              --silent \
              --show-error \
              --connect-timeout 15 \
              --max-time 120 \
              --ssl-reqd \
              --ftp-pasv \
              --ftp-create-dirs \
              --user "$PREVIEW_FTP_USER:$PREVIEW_FTP_PASSWORD" \
              --upload-file "$file" \
              "$ftp_root/$relative_path"
            uploaded_count=$((uploaded_count + 1))
          done < <(find dist -type f -print0)

          (( uploaded_count > 0 ))
          printf 'Preview deployment uploaded %s files from dist/ contents.\n' "$uploaded_count"

      - name: Verify deployed preview URLs
        shell: bash
        run: |
          set -euo pipefail

          preview_origin='https://preview.amralaa.site'
          paths=(
            /
            /projects/ai-maintenance-planner/
            /projects/master-data-automation-initiative/
            /projects/sap-support-analytics-power-bi/
            /sitemap-index.xml
            /robots.txt
            /assets/cv.pdf
          )

          for path in "${paths[@]}"; do
            status=$(curl \
              --fail \
              --silent \
              --show-error \
              --connect-timeout 15 \
              --max-time 45 \
              --output /dev/null \
              --write-out '%{http_code}' \
              "$preview_origin$path")
            [[ "$status" == '200' ]]
            printf 'Preview URL reachable: %s (HTTP %s)\n' "$path" "$status"
          done
